[package]
name = "systest"
version = "0.1.0"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
build = "build.rs"
publish = false
edition = "2018"

[dependencies]
curl-sys = { path = "../curl-sys" }
libc = "0.2"

[build-dependencies]
ctest2 = "0.4"
cc = "1.0"

[features]
static-ssl = ['curl-sys/static-ssl']
websocket = ['curl-sys/websocket']
ws_start_frame_8_16_0 = ['websocket', 'curl-sys/ws_start_frame_8_16_0']
